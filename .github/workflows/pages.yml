name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copia el sitio a _site dejando fuera lo que NO debe ser público:
      # documentación interna, config de editor y metadatos de git/CI.
      # Sin esto, https://viciostorpes.com/MANTENIMIENTO.md devuelve 200.
      - name: Build publishable site
        run: |
          rsync -a ./ ./_site \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.vscode' \
            --exclude '.claude' \
            --exclude 'docs' \
            --exclude 'README.md' \
            --exclude 'MANTENIMIENTO.md' \
            --exclude '.DS_Store' \
            --exclude '.gitignore'
          echo "--- Publicado:"
          find ./_site -maxdepth 1

      # enablement: activa GitHub Pages (source = Actions) si aún no lo está,
      # para no depender de que alguien lo marque a mano en Settings > Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
