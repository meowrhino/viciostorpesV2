<!DOCTYPE html>
<html lang="en">
<head>
  <!-- SYNC: head compartido — cambios aquí deben replicarse en index/tattoo/flashbook/booking.html -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- COPIA ARCHIVADA: la web viva es viciostorpes.com. noindex evita que
       esta copia compita en Google con el sitio real. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f0f12">
  <meta name="description" content="ViciosTorpes — Book your tattoo appointment with Marc.">
  <meta name="author" content="ViciosTorpes">
  <meta name="keywords" content="book tattoo, tattoo appointment, booking tattoo, Barcelona, Marc, viciostorpes">
  <link rel="canonical" href="https://viciostorpes.com/booking.html">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="viciostorpes — booking">
  <meta property="og:description" content="Book your tattoo appointment with Marc.">
  <meta property="og:image" content="https://viciostorpes.com/data/backgrounds/howToBook.webp">
  <meta property="og:url" content="https://viciostorpes.com/booking.html">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="viciostorpes">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="viciostorpes — booking">
  <meta name="twitter:description" content="Book your tattoo appointment with Marc.">
  <meta name="twitter:image" content="https://viciostorpes.com/data/backgrounds/howToBook.webp">
  <title>viciostorpes — booking</title>
  <link rel="icon" type="image/png" href="data/favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/booking.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Fondo fijo -->
  <div class="booking-bg"></div>

  <!-- Formulario de contacto -->
  <main class="booking-container">
    <!-- COPIA ARCHIVADA — formulario desactivado a proposito.
         Sin action, sin method y con los campos dentro de un <fieldset disabled>:
         no hay forma de enviar nada desde aqui, ni con JS ni sin el. El endpoint
         real vive solo en el repo activo (viciostorpes/web). -->
    <form class="booking-form" onsubmit="return false;">
      <div class="archive-notice" role="status">
        <p class="archive-notice-title">This form is no longer active</p>
        <p class="archive-notice-body">
          You are looking at an archived copy of the site. Messages sent from
          here would not reach anyone.
        </p>
        <a class="archive-notice-cta" href="https://viciostorpes.com/booking.html">
          Go to viciostorpes.com to book
        </a>
      </div>

      <fieldset class="archive-fieldset" disabled>

      <!-- Name -->
      <div class="form-group">
        <label for="name" class="form-label">Name *</label>
        <input
          type="text"
          id="name"
          name="name"
          class="form-input"
          required
          placeholder="Your name"
        >
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email *</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          required
          autocomplete="email"
          inputmode="email"
          pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
          placeholder="you@email.com"
        >
      </div>

      <!-- Instagram username (optional) -->
      <div class="form-group">
        <label for="instagram" class="form-label">Instagram (optional)</label>
        <input
          type="text"
          id="instagram"
          name="instagram"
          class="form-input"
          autocomplete="username"
          inputmode="text"
          pattern="^@?[A-Za-z0-9._]{1,30}$"
          placeholder="@yourhandle"
        >
      </div>

      <!-- Location -->
      <div class="form-group">
        <label for="location" class="form-label">Location *</label>
        <input
          type="text"
          id="location"
          name="location"
          class="form-input"
          required
          placeholder="Barcelona, Madrid, etc."
        >
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description" class="form-label">Description *</label>
        <textarea
          id="description"
          name="description"
          class="form-textarea"
          rows="6"
          required
          placeholder="Tell me what you have in mind..."
        ></textarea>
      </div>

      <!-- Reference images -->
      <div class="form-group">
        <label for="attachment" class="form-label">Reference images</label>
        <input
          type="file"
          id="attachment"
          name="attachment"
          class="form-input form-file"
          accept="image/*"
          multiple
        >
        <p class="form-hint">You can add them in multiple batches. Click ✕ to remove one. Total size up to 9 MB.</p>
        <ul id="attachment-previews" class="attachment-previews" aria-live="polite"></ul>
      </div>

      </fieldset>
    </form>

    <!-- Firma -->
    <footer class="booking-footer">
      <p>web:meowrhino</p>
    </footer>
  </main>

  <!-- Contenedor de navegación posicional -->
  <div class="nav-container">
    <!-- Booking está abajo, entonces home está arriba -->
    <a href="index.html" class="nav-btn pos-top">home</a>
  </div>

  <script src="js/data-loader.js"></script>
  <script src="js/transitions.js"></script>
</body>
</html>
